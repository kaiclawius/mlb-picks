<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ChumGPT lab cam</title>
<style>
/* The 24/7 lab cam: a fixed 1280x720 stage that the stream server films.
   Everything is local (fonts, face, show), every scene is guarded, and the page reports a heartbeat
   to the supervisor so a stuck browser gets replaced. Keep effects cheap: it renders on a CPU. */
@font-face{font-family:VT323;src:url(fonts/vt323.woff2) format('woff2')}
@font-face{font-family:Bungee;src:url(fonts/bungee.woff2) format('woff2')}
:root{--phos:#7dff8a;--red:#ff5a4a;--bucket:#e0362c;--amber:#ffc24a;--deep:#061a1d;--lab:#0b2a2e;--mute:#8fb3ad;--term:VT323,'DejaVu Sans Mono',monospace;--head:Bungee,Impact,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1280px;height:720px;overflow:hidden;background:#000;cursor:none}
#stage{position:relative;width:1280px;height:720px;overflow:hidden;font-family:var(--term);color:var(--phos);
  background:radial-gradient(ellipse 55% 60% at 50% 46%,#123d40 0%,#0b2a2e 45%,#061a1d 100%)}
/* lab set: back wall planks, a shelf, the desk */
.wall{position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(0,0,0,.18) 0 2px,transparent 2px 160px)}
.shelf{position:absolute;top:96px;height:10px;background:#2a1c14;box-shadow:0 6px 12px rgba(0,0,0,.5)}
.shelf.l{left:60px;width:250px}.shelf.r{right:60px;width:250px}
.jar{position:absolute;bottom:10px;width:34px;border-radius:6px 6px 4px 4px;background:linear-gradient(180deg,rgba(125,255,138,.25),rgba(125,255,138,.08));border:2px solid rgba(180,220,200,.35)}
.desk{position:absolute;left:0;right:0;bottom:0;height:150px;background:linear-gradient(180deg,#3a2618,#22160e);box-shadow:0 -4px 0 #4a3020}
.glow{position:absolute;left:390px;top:80px;width:500px;height:440px;background:radial-gradient(circle,rgba(125,255,138,.16),transparent 65%)}
.glow.red{background:radial-gradient(circle,rgba(255,90,74,.2),transparent 65%)}
#face{position:absolute;left:440px;top:96px;width:400px;height:400px;animation:bob 5s ease-in-out infinite}
#face svg{width:100%;height:100%;overflow:visible}
@keyframes bob{50%{transform:translateY(-8px) rotate(-.6deg)}}
#face .pupil{transition:transform .5s cubic-bezier(.2,.8,.2,1)}
#face .eye{transform-box:fill-box;transform-origin:50% 50%;transition:transform .08s}
#face.blink .eye{transform:scaleY(.1)}

/* top bar */
.top{position:absolute;left:0;right:0;top:0;height:54px;display:flex;align-items:center;gap:22px;padding:0 28px;font-size:26px;color:var(--mute);background:linear-gradient(180deg,rgba(0,0,0,.55),transparent)}
.live{color:#fff;display:flex;align-items:center;gap:8px}.live i{width:12px;height:12px;border-radius:50%;background:var(--bucket);box-shadow:0 0 10px var(--bucket);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35}}
.top .logo{margin-left:auto;font-family:var(--head);font-size:22px;color:var(--phos)}.top .logo b{color:var(--bucket);font-weight:400}
#clock{color:var(--amber);min-width:160px;text-align:right}

/* side panels */
.panel{position:absolute;top:120px;width:300px;background:rgba(0,16,6,.82);border:2px solid rgba(125,255,138,.25);border-radius:14px;padding:16px 18px;box-shadow:0 18px 40px rgba(0,0,0,.45)}
.panel h3{font-weight:400;font-size:22px;color:var(--amber);letter-spacing:.06em;margin-bottom:8px}
#left{left:40px}#right{right:40px;min-height:200px}
.guide div{display:flex;justify-content:space-between;font-size:24px;line-height:1.25;color:var(--mute)}
.guide div.now{color:var(--phos)}
.stats{margin-top:14px;padding-top:12px;border-top:1px dashed rgba(125,255,138,.25);font-size:21px;line-height:1.35;color:var(--mute)}
.stats b{color:var(--phos);font-weight:400}
#board{font-size:25px;line-height:1.22;color:#d9ffe0}
#board .t{color:var(--amber);font-size:22px;margin-bottom:6px}
#board li{list-style:none;margin:6px 0;opacity:0;transform:translateX(12px);transition:opacity .4s,transform .4s}
#board li.in{opacity:1;transform:none}
#board li::before{content:"> ";color:var(--mute)}
.stamp{position:absolute;right:16px;bottom:16px;font-family:var(--head);font-size:30px;color:var(--bucket);border:4px solid var(--bucket);border-radius:8px;padding:2px 12px;transform:rotate(-12deg) scale(2.4);opacity:0;transition:transform .25s cubic-bezier(.5,0,.75,0),opacity .25s}
.stamp.in{transform:rotate(-12deg) scale(1);opacity:.95}
#right.hide,#left.hide{opacity:0}
.panel{transition:opacity .5s}

/* captions + ticker */
#cap{position:absolute;left:300px;right:300px;bottom:84px;min-height:94px;padding:12px 20px;background:rgba(0,10,4,.86);border:2px solid rgba(125,255,138,.3);border-radius:14px;font-size:34px;line-height:1.08;color:var(--phos);text-shadow:0 0 8px rgba(125,255,138,.55);display:flex;align-items:center}
#cap::before{content:attr(data-who);position:absolute;top:-14px;left:16px;font-size:20px;line-height:1;background:#001006;color:var(--amber);padding:2px 8px;border-radius:6px;border:1px solid rgba(125,255,138,.3)}
#cap.red{color:var(--red);border-color:rgba(255,90,74,.5);text-shadow:0 0 8px rgba(255,90,74,.6)}
#cap .cur{display:inline-block;width:12px;height:28px;background:currentColor;margin-left:3px;vertical-align:-3px;animation:pulse 1s steps(1) infinite}
.ticker{position:absolute;left:0;right:0;bottom:0;height:46px;background:var(--bucket);color:#fff;font-size:28px;display:flex;align-items:center;overflow:hidden;border-top:3px solid #000}
.ticker .tag{flex:none;height:100%;display:flex;align-items:center;padding:0 16px;background:#000;color:var(--amber);font-family:var(--head);font-size:18px;z-index:1}
#crawl{white-space:nowrap;will-change:transform;padding-left:20px}

/* full-screen layers: channel static, power cut, boot */
#snow{position:absolute;inset:0;width:1280px;height:720px;image-rendering:pixelated;display:none;z-index:20}
#black{position:absolute;inset:0;z-index:30;background:#000;display:none;color:#cfd8d4;font-size:64px;align-items:center;justify-content:center;flex-direction:column;gap:12px}
#black small{font-size:26px;color:#5d6b66}
#bootlog{position:absolute;inset:0;z-index:31;background:#000;display:none;padding:60px 80px;font-size:34px;line-height:1.25;color:var(--phos);text-shadow:0 0 8px rgba(125,255,138,.6);white-space:pre-wrap}
/* live events: chat question, new minions, milestones */
#board .ask{color:var(--amber);font-size:23px;margin:4px 0 8px}
#board .q{color:#fff;font-size:25px;line-height:1.2;border-left:3px solid var(--amber);padding-left:10px;overflow-wrap:anywhere}
#toast{position:absolute;left:50%;top:62px;z-index:25;transform:translate(-50%,-140%);background:var(--amber);color:#1a1200;font-family:var(--head);font-size:22px;padding:10px 22px;border:3px solid #000;border-radius:12px;box-shadow:0 6px 0 #000;transition:transform .45s cubic-bezier(.2,1.4,.4,1);white-space:nowrap;max-width:760px;overflow:hidden;text-overflow:ellipsis}
#toast.in{transform:translate(-50%,0)}
#banner{position:absolute;inset:0;z-index:26;display:none;align-items:center;justify-content:center;flex-direction:column;gap:6px;background:radial-gradient(circle,rgba(0,40,12,.92),rgba(0,8,3,.96))}
#banner b{font-family:var(--head);font-weight:400;font-size:120px;color:var(--phos);text-shadow:0 0 30px rgba(125,255,138,.7),6px 6px 0 #003d12;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
#banner span{font-family:var(--head);font-size:34px;color:var(--amber)}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.scan{position:absolute;inset:0;z-index:40;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px),radial-gradient(ellipse at 50% 50%,transparent 62%,rgba(0,0,0,.5))}
#stage.red .glow{background:radial-gradient(circle,rgba(255,90,74,.22),transparent 65%)}
#stage.shake{animation:shake .12s linear infinite}
@keyframes shake{25%{transform:translate(3px,-2px)}50%{transform:translate(-3px,1px)}75%{transform:translate(2px,2px)}}
</style>
</head>
<body>
<div id="stage">
  <div class="wall"></div>
  <div class="shelf l"><span class="jar" style="left:20px;height:44px"></span><span class="jar" style="left:70px;height:30px"></span><span class="jar" style="left:170px;height:52px"></span></div>
  <div class="shelf r"><span class="jar" style="left:30px;height:36px"></span><span class="jar" style="left:120px;height:56px"></span><span class="jar" style="left:190px;height:28px"></span></div>
  <div class="desk"></div>
  <div class="glow"></div>
  <div id="face"></div>

  <div class="top"><span class="live"><i></i>LIVE</span><span>LAB CAM 03</span><span id="chan">CH 01 · LAB CAM</span><span class="logo">CHUM<b>GPT</b></span><span id="clock">--:--:-- UTC</span></div>

  <div class="panel" id="left">
    <h3>PROGRAM</h3>
    <div class="guide" id="guide"></div>
    <div class="stats">
      plans failed: <b id="sFailed">0</b><br>
      days at v0.1: <b id="sDays">0</b><br>
      outlet owner: <b>karen</b><br>
      wallet: <b>none. never.</b><br>
      minions: <b id="sMinions">recruiting…</b>
    </div>
  </div>
  <div class="panel hide" id="right"><div id="board"></div><span class="stamp" id="stamp">FAILED</span></div>

  <div id="cap" data-who="CHUMGPT"><span id="capText"></span></div>
  <div class="ticker"><span class="tag">LAB NEWS</span><span id="crawl"></span></div>

  <div id="toast"></div>
  <div id="banner"><b id="bannerN"></b><span>MINIONS IN THE CHUM ARMY</span></div>
  <canvas id="snow" width="320" height="180"></canvas>
  <div id="black"><span>NO SIGNAL</span><small>CHUM·TRONIX 3000 · karen pulled the plug</small></div>
  <div id="bootlog"></div>
  <div class="scan"></div>
</div>
<script src="kit/face.js"></script>
<script src="show.js"></script>
<script>
(() => {
'use strict';
const $ = (s) => document.getElementById(s);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const rnd = (a, b) => a + Math.random() * (b - a);
const SHOW = window.SHOW;
const face = window.chumFace;
const HB = '/hb';                  // supervisor heartbeat endpoint; missing in a plain preview, that's fine
let errors = 0, frames = 0, segName = 'boot', segStarted = Date.now(), pendingCmd = null;
addEventListener('error', () => { errors++; });
addEventListener('unhandledrejection', () => { errors++; });

/* ---------- sound: everything synthesized, no files ---------- */
let AC = null, OUT = null;
function audio() {
  if (AC) return AC;
  try {
    AC = new AudioContext(); OUT = AC.createGain(); OUT.gain.value = 1.0;
    // a compressor plus make-up gain keeps the voice at stream loudness without clipping
    const comp = AC.createDynamicsCompressor(); comp.threshold.value = -26; comp.knee.value = 8; comp.ratio.value = 4; comp.attack.value = 0.004; comp.release.value = 0.2;
    const makeup = AC.createGain(); makeup.gain.value = 2.2;
    OUT.connect(comp); comp.connect(makeup); makeup.connect(AC.destination);
    // room tone: a soft CRT hum plus filtered noise, always on so the stream never has dead air
    const hum = AC.createOscillator(), hg = AC.createGain(); hum.frequency.value = 60; hg.gain.value = 0.02; hum.connect(hg); hg.connect(OUT); hum.start();
    const n = AC.createBufferSource(); n.buffer = noiseBuf(2); n.loop = true;
    const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 500; const ng = AC.createGain(); ng.gain.value = 0.02;
    n.connect(f); f.connect(ng); ng.connect(OUT); n.start();
  } catch (e) { AC = null; }
  return AC;
}
function noiseBuf(sec) { const b = AC.createBuffer(1, AC.sampleRate * sec, AC.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; return b; }
function tone(freq, dur, vol = 0.05, type = 'square', slideTo) {
  if (!audio()) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t); if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  o.connect(g); g.connect(OUT); o.start(t); o.stop(t + dur + 0.02);
}
function staticNoise(dur, vol = 0.09) {
  if (!audio()) return;
  const s = AC.createBufferSource(), g = AC.createGain(), f = AC.createBiquadFilter(), t = AC.currentTime;
  s.buffer = noiseBuf(Math.max(0.2, dur)); f.type = 'bandpass'; f.frequency.value = 2400; f.Q.value = 0.6;
  g.gain.setValueAtTime(vol, t); g.gain.linearRampToValueAtTime(0.0008, t + dur);
  s.connect(f); f.connect(g); g.connect(OUT); s.start(t); s.stop(t + dur);
}
const VOICE = { scheme: 230, laugh: 300, rage: 170, sad: 150, smug: 210, yes: 280, conquer: 190, karen: 240, static: 120 };

/* ---------- the face ---------- */
const faceEl = $('face');
let mood = 'smug', eyeX = 0, eyeY = 0;
function setMood(m) {
  if (!face) return;
  mood = m in VOICE ? m : 'smug';
  faceEl.innerHTML = face(m === 'static' ? 'rage' : mood, { id: 'st', talk: true, lite: true });
  lookAt(eyeX, eyeY);
}
function lookAt(x, y) { eyeX = x; eyeY = y; const p = faceEl.querySelector('.pupil'); if (p) p.style.transform = `translate(${x * 10}px,${y * 9}px)`; }
function mouth(frame) { // frame: -1 = mood mouth, 0..2 = talking frames
  const m = faceEl.querySelector('.mouth'), t = faceEl.querySelector('.talk');
  if (!m || !t) return;
  m.style.display = frame < 0 ? '' : 'none'; t.style.display = frame < 0 ? 'none' : '';
  for (let i = 0; i < 3; i++) { const g = t.querySelector('.t' + i); if (g) g.style.display = i === frame ? '' : 'none'; }
}
// idle life: blinks and glances, forever, independent of the show
(function blink() { faceEl.classList.add('blink'); setTimeout(() => faceEl.classList.remove('blink'), 110); setTimeout(blink, rnd(2200, 6000)); })();
(function glance() { lookAt(rnd(-1, 1), rnd(-0.6, 0.8)); setTimeout(glance, rnd(1400, 4200)); })();

/* ---------- captions with a babble voice ---------- */
const cap = $('cap'), capText = $('capText');
async function say(text, m = 'smug', who = 'CHUMGPT') {
  setMood(m);
  cap.dataset.who = who; cap.classList.toggle('red', m === 'static');
  capText.textContent = ''; const cur = document.createElement('span'); cur.className = 'cur';
  const words = String(text);
  for (let i = 0; i < words.length; i++) {
    const ch = words[i];
    capText.textContent = words.slice(0, i + 1); capText.appendChild(cur);
    if (/[a-z0-9]/i.test(ch)) { if (i % 2 === 0) { tone(VOICE[m] * rnd(0.85, 1.25), 0.05, 0.09, m === 'static' ? 'sawtooth' : 'triangle'); mouth(1 + (Math.random() < 0.5 ? 1 : 0)); } }
    else mouth(0);
    await sleep(ch === '.' || ch === '?' || ch === '!' ? 220 : ch === ',' ? 120 : 38);
  }
  cur.remove(); mouth(-1);
  await sleep(1800 + words.length * 38);
}

/* ---------- top bar, guide, stats, ticker ---------- */
const pad = (n) => String(n).padStart(2, '0');
function tickClock() { const d = new Date(); $('clock').textContent = `${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}:${pad(d.getUTCSeconds())} UTC`; }
setInterval(tickClock, 1000); tickClock();
// counters come from the clock, so they keep counting across restarts without any storage
const EPOCH = Date.UTC(2025, 7, 29);
function stats() {
  const now = Date.now();
  $('sFailed').textContent = (4000000 + Math.floor((now - EPOCH) / 90000)).toLocaleString('en-US');
  $('sDays').textContent = String(Math.floor((now - EPOCH) / 86400000));
}
setInterval(stats, 15000); stats();
const NAMES = { labcam: 'LAB CAM', plan: 'PLAN OF THE HOUR', lore: 'LORE HOUR', ads: 'COMMERCIALS', static: '???', powercut: 'NO SIGNAL' };
function guide(now, next) {
  $('guide').innerHTML = '';
  [['now', now], ['next', next]].forEach(([k, v]) => { const d = document.createElement('div'); if (k === 'now') d.className = 'now'; const a = document.createElement('span'), b = document.createElement('span'); a.textContent = k; b.textContent = NAMES[v] || v; d.append(a, b); $('guide').appendChild(d); });
}
const crawl = $('crawl');
let crawlX = 0, crawlW = 0;
function nextTicker() { crawl.textContent = SHOW.ticker.slice().sort(() => Math.random() - 0.5).join('   ✦   '); crawlW = crawl.scrollWidth; crawlX = 1280; }
nextTicker();

/* ---------- full-screen effects ---------- */
const snow = $('snow'), sctx = snow.getContext('2d'), img = sctx.createImageData(320, 180);
async function channelStatic(ms = 650) {
  snow.style.display = 'block'; staticNoise(ms / 1000);
  const end = performance.now() + ms;
  while (performance.now() < end) {
    const d = img.data; for (let i = 0; i < d.length; i += 4) { const v = Math.random() * 255 | 0; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; }
    sctx.putImageData(img, 0, 0); await sleep(40);
  }
  snow.style.display = 'none';
}
async function bootSequence() {
  const log = $('bootlog'); log.style.display = 'block'; log.textContent = '';
  for (const line of SHOW.boot) {
    for (const ch of line) { log.textContent += ch; if (Math.random() < 0.3) tone(1200, 0.015, 0.02); await sleep(16); }
    log.textContent += '\n'; await sleep(line ? 160 : 320);
  }
  await sleep(700); log.style.display = 'none';
}

/* ---------- segments ---------- */
const right = $('right'), board = $('board'), stamp = $('stamp');
function boardReset(title) { board.innerHTML = ''; const t = document.createElement('div'); t.className = 't'; t.textContent = title; board.appendChild(t); stamp.classList.remove('in'); right.classList.remove('hide'); }
function boardLine(text) { const li = document.createElement('li'); li.textContent = text; board.appendChild(li); requestAnimationFrame(() => li.classList.add('in')); }
let planNo = Math.floor((Date.now() - EPOCH) / 3600000);
let canon = null;
fetch('kit/canon.json').then((r) => r.ok ? r.json() : null).then((j) => { canon = j; }).catch(() => {});

const SEG = {
  async labcam() {
    right.classList.add('hide');
    const end = Date.now() + rnd(120, 210) * 1000;
    while (Date.now() < end) {
      if (await serveInbox()) { await sleep(2000); continue; }
      const [m, t] = pick(SHOW.idle); await say(t, m);
      // wait for the next line, but jump in early when the chat or new minions need an answer
      const until = Date.now() + rnd(3000, 9000);
      while (Date.now() < until && !inbox.length) await sleep(250);
    }
  },
  async plan() {
    const P = SHOW.plan; planNo++;
    const goal = pick(P.goals), steps = [`acquire ${pick(P.prep)}`, pick(P.method), `strike ${pick(P.timing)}`, 'phase two: world domination'];
    boardReset(`PLAN #${planNo}: ${goal}`);
    await say(`plan number ${planNo}. the goal: ${goal}. this time it's flawless.`, 'scheme');
    for (let i = 0; i < steps.length; i++) { boardLine(steps[i]); await say(`step ${i + 1}: ${steps[i]}.`, i === steps.length - 1 ? 'conquer' : 'scheme'); }
    await say('executing… now.', 'yes'); await sleep(2500);
    stamp.classList.add('in'); tone(110, 0.25, 0.08, 'square'); document.getElementById('stage').classList.add('shake'); await sleep(350); document.getElementById('stage').classList.remove('shake');
    await say(`it failed. ${pick(P.flaw)}`, 'rage');
    await say(pick(['next plan in one hour. it will be perfect.', 'i blame the timing. and karen.', 'that was a test. a very convincing test.']), pick(['sad', 'smug']));
  },
  async lore() {
    const files = canon && Array.isArray(canon.lore) && canon.lore.length ? canon.lore : null;
    if (!files) return SEG.labcam();
    const f = pick(files);
    boardReset(`FILE ${f.n}: ${f.title}`);
    await say(`lore hour. tonight: file ${f.n}, ${f.title}.`, 'smug');
    const parts = String(f.text).match(/[^.!?]+[.!?]+["”]?/g) || [f.text];
    for (const p of parts) { boardLine(p.trim().slice(0, 70) + (p.trim().length > 70 ? '…' : '')); await say(p.trim(), f.mood || 'smug'); }
    await say('end of file. ask me about it once the chat is open.', 'yes');
  },
  async ads() {
    right.classList.add('hide');
    await say('and now… a word from our sponsors. we have no sponsors.', 'smug', 'COMMERCIAL BREAK');
    const list = SHOW.ads.slice().sort(() => Math.random() - 0.5).slice(0, 3);
    for (const [m, t] of list) { await channelStatic(300); await say(t, m, 'COMMERCIAL BREAK'); }
  },
  async static() {
    const st = document.getElementById('stage');
    await channelStatic(500); st.classList.add('red', 'shake'); setTimeout(() => st.classList.remove('shake'), 400);
    await say(pick(SHOW.static), 'static', 'STATIC');
    await channelStatic(500); st.classList.remove('red');
    await say(pick(['who was that? nobody saw that. moving on.', 'ignore the red one. he is a rendering error.', 'STATIC! get out of my screen!']), 'rage');
  },
  // the power cut gag; the supervisor also uses it to swap in a fresh browser without anyone noticing
  async powercut(forRestart) {
    await say(pick(['wait. karen, what are you doing with that plug?', 'karen. KAREN. not the outl—']), 'karen');
    tone(400, 0.6, 0.06, 'sine', 40); $('black').style.display = 'flex';
    if (forRestart) {
      try { await fetch('/ready', { method: 'POST' }); } catch (e) {}
      await sleep(25000);              // the supervisor restarts the browser during this; if it doesn't, carry on
    } else await sleep(rnd(6000, 10000));
    await bootSequence(); $('black').style.display = 'none';
    await say(pick(["i'm back. karen, we will discuss this.", 'rebooted. i remember everything. especially that.']), 'rage');
  }
};

/* ---------- live events from the brain (chat answers, new minions, milestones) ---------- */
const inbox = [];                 // events waiting for a calm moment
const INBOX_MAX = 4;
let lastMinionLine = 0;
function minionToast(e) {
  const t = $('toast');
  const tags = (e.tags || []).slice(0, 3).map((n) => '#' + n).join(' ');
  t.textContent = e.count > 1 ? `+${e.count} NEW MINIONS JOINED THE CHUM ARMY  ${tags}` : `NEW MINION ${tags} JOINED THE CHUM ARMY`;
  t.classList.add('in'); [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, 0.12, 0.06, 'square'), i * 90));
  clearTimeout(minionToast.t); minionToast.t = setTimeout(() => t.classList.remove('in'), 5200);
}
function milestoneBanner(e) {
  $('bannerN').textContent = Number(e.n).toLocaleString('en-US'); $('banner').style.display = 'flex';
  [392, 523, 659, 784, 1046, 1318].forEach((f, i) => setTimeout(() => tone(f, 0.18, 0.07, 'square'), i * 120));
  setTimeout(() => { $('banner').style.display = 'none'; }, 6500);
}
function receive(list) {
  for (const e of list || []) {
    if (!e || typeof e.type !== 'string') continue;
    if (e.type === 'minions') minionToast(e);
    if (e.type === 'milestone') milestoneBanner(e);
    if (inbox.length < INBOX_MAX) inbox.push(e);
  }
}
const fill = (tpl, e) => tpl.replace('{n}', Number(e.n || 0).toLocaleString('en-US'));
// played at calm moments: between idle lines and between shows
async function serveInbox() {
  let served = 0;
  while (inbox.length && served < 3) {
    const e = inbox.shift(); served++;
    if (Date.now() - (e.at || Date.now()) > 240000) continue;
    try {
      if (e.type === 'chat' && e.reply) {
        boardReset('LIVE CHAT');
        if (e.ask) { const a = document.createElement('div'); a.className = 'ask'; a.textContent = `${e.who || 'a minion'}`; const q = document.createElement('div'); q.className = 'q'; q.textContent = e.ask; board.append(a, q); }
        await sleep(900);
        await say(String(e.reply), e.mood || 'smug');
        right.classList.add('hide');
      } else if (e.type === 'minions' && Date.now() - lastMinionLine > 20000) {
        lastMinionLine = Date.now(); const [m, t] = pick(SHOW.minion || [['yes', 'new minion detected. welcome to the lab.']]); await say(t, m);
      } else if (e.type === 'milestone') {
        const [m, t] = pick(SHOW.milestone || [['conquer', '{n} minions!']]); await say(fill(t, e), m);
      }
    } catch (err) { errors++; }
  }
  return served;
}

/* ---------- run of show ---------- */
const MAX_SEG = 8 * 60 * 1000;           // no segment may run longer than this
let lastCut = Date.now(), lastStatic = Date.now();
function chooseNext(prev) {
  if (Date.now() - lastCut > rnd(50, 70) * 60000) { lastCut = Date.now(); return 'powercut'; }
  if (Date.now() - lastStatic > rnd(25, 40) * 60000) { lastStatic = Date.now(); return 'static'; }
  if (prev !== 'labcam') return 'labcam';
  return pick(['plan', 'plan', 'lore', 'ads']);
}
async function run() {
  setMood('smug');
  if (new URLSearchParams(location.search).has('boot')) await bootSequence().catch(() => {});
  const first = new URLSearchParams(location.search).get('seg');
  let prev = 'boot', next = first && SEG[first] ? first : 'labcam';
  for (;;) {
    let seg = next;
    if (pendingCmd === 'powercut') { pendingCmd = null; seg = 'restart'; }
    next = chooseNext(seg === 'restart' ? 'powercut' : seg);
    guide(seg === 'restart' ? 'powercut' : seg, next);
    if (inbox.length) { segName = 'chat'; segStarted = Date.now(); await serveInbox().catch(() => {}); }
    segName = seg; segStarted = Date.now();
    const shown = seg === 'restart' ? 'powercut' : seg, chNo = ['labcam', 'plan', 'lore', 'ads'].indexOf(shown) + 1;
    $('chan').textContent = `CH ${chNo ? '0' + chNo : '??'} · ${NAMES[shown] || ''}`;
    try {
      if (seg !== 'labcam' && seg !== 'restart') await channelStatic();
      const job = seg === 'restart' ? SEG.powercut(true) : SEG[seg]();
      await Promise.race([job, sleep(MAX_SEG)]);
    } catch (e) { errors++; await sleep(1000); }
    prev = seg;
  }
}

/* ---------- render loop + heartbeat ---------- */
let lastT = performance.now();
function frame(t) {
  frames++;
  const dt = Math.min(100, t - lastT); lastT = t;
  crawlX -= dt * 0.09; if (crawlX < -crawlW) nextTicker();
  crawl.style.transform = `translateX(${crawlX}px)`;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
async function heartbeat() {
  try {
    const r = await fetch(HB, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ frames, seg: segName, segAge: Date.now() - segStarted, errors, audio: AC ? AC.state : 'none', vw: innerWidth, vh: innerHeight, gen: Number(new URLSearchParams(location.search).get('gen')), room: INBOX_MAX - inbox.length }) });
    if (r.ok) {
      const j = await r.json();
      if (j && j.cmd === 'powercut') pendingCmd = 'powercut';
      if (j && j.events) receive(j.events);
      if (j && j.stats && Number.isFinite(j.stats.minions)) $('sMinions').textContent = j.stats.minions.toLocaleString('en-US');
    }
  } catch (e) { /* no supervisor (preview) */ }
}
setInterval(heartbeat, 2000);
// last line of defence inside the page: if the show loop is stuck far past its limit, reload
setInterval(() => { if (Date.now() - segStarted > MAX_SEG + 120000) location.reload(); }, 30000);

audio(); run();
})();
</script>
