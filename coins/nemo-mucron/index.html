<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

  // ---- set these after launch ----
  window.NEMO = {

<style>
/* Drawn like the Mucron art: white paper, tricolore brush strokes, one dark outline colour,
   flat fills, hard cartoon shadows, slightly wonky shapes. */
:root{
  --ink:#0e1f29; --blue:#173286; --red:#e7171e; --skin:#ffcbba; --paper:#fff; --sky:#2aa0d0; --gold:#e8c35a; --fur:#1d1d21;
  --toon:'Luckiest Guy',system-ui,sans-serif; --hand:'Patrick Hand',system-ui,sans-serif;
  --line:5px solid var(--ink); --shadow:8px 8px 0 var(--ink);
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{overflow-x:clip}
html{background:var(--paper);color:var(--ink);scroll-behavior:smooth}
body{font-family:var(--hand);font-size:22px;line-height:1.35;background:var(--paper)}
a,button{font:inherit;color:inherit;cursor:pointer}
img{display:block;max-width:100%}
.wrap{width:min(1180px,100% - 32px);margin-inline:auto}
section,header{position:relative;overflow-x:clip}
section > .wrap, header > .wrap{position:relative;z-index:1}
.brush{position:absolute;z-index:0;pointer-events:none}

/* cartoon pieces */
.btn{display:inline-flex;align-items:center;gap:.4em;border:4px solid var(--ink);border-radius:999px 860px 999px 900px;box-shadow:5px 5px 0 var(--ink);
  font-family:var(--toon);font-size:23px;letter-spacing:.02em;padding:.5em 1.1em .35em;text-decoration:none;background:var(--paper);
  transition:transform .12s cubic-bezier(.34,1.6,.64,1),box-shadow .12s}
.btn:hover{transform:translate(-2px,-2px) rotate(-1.5deg);box-shadow:7px 7px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.btn.blue{background:var(--blue);color:#fff}.btn.red{background:var(--red);color:#fff}.btn.small{font-size:17px;padding:.42em .9em .28em}
.toon{font-family:var(--toon);letter-spacing:.01em;line-height:.95;color:#fff;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-shadow:6px 6px 0 var(--ink)}
h2{font-size:clamp(46px,6.6vw,82px);margin-bottom:14px}
.kicker{font-size:25px;margin-bottom:34px;max-width:46ch}

/* nav with the language switch */
nav{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:var(--line)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0}
.logo{font-family:var(--toon);font-size:28px;text-decoration:none;display:flex;align-items:center;gap:10px;white-space:nowrap}
.logo img{width:44px;height:auto} .logo b{color:var(--blue)} .logo i{font-style:normal;color:var(--red)}
.lang{display:flex;border:4px solid var(--ink);border-radius:14px 10px 16px 9px;overflow:hidden;box-shadow:4px 4px 0 var(--ink)}
.lang button{border:0;background:#fff;font-family:var(--toon);font-size:15px;padding:8px 11px 4px;border-right:3px solid var(--ink)}
.lang button:last-child{border-right:0}
.lang button[aria-pressed="true"]{background:var(--blue);color:#fff}
.lang button.mix[aria-pressed="true"]{background:linear-gradient(90deg,var(--blue) 0 33%,#fff 33% 66%,var(--red) 66%);color:var(--ink);text-shadow:0 0 3px #fff,0 0 3px #fff}
@media (max-width:760px){.logo span{display:none}.lang button{font-size:13px;padding:7px 8px 3px}#buyNav{display:none}}

/* hero */
.hero{display:grid;grid-template-columns:1fr 1fr;gap:46px;align-items:center;padding:44px 0 70px}
@media (max-width:900px){.hero{grid-template-columns:1fr;gap:30px;padding-top:22px}.hero .art{order:-1;width:min(440px,100%)}}
.hero h1{font-size:clamp(70px,10.5vw,136px)}
.hero h1 .n{color:var(--blue);display:block} .hero h1 .m{color:var(--red);display:block;margin-left:.25em}
.hero .say{font-size:clamp(24px,2.6vw,31px);margin:24px 0 26px;max-width:26ch}
.hero .say u{text-decoration:underline wavy var(--red) 3px;text-underline-offset:5px}
.cta{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.ca{margin-top:22px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:19px}
.ca code{font-family:ui-monospace,monospace;font-size:15px;background:#fff;border:3px solid var(--ink);border-radius:10px 14px 9px 12px;padding:7px 11px;word-break:break-all}
.pair{display:inline-flex;align-items:center;gap:10px;margin-top:18px;font-size:20px;background:var(--skin);border:4px solid var(--ink);border-radius:16px 10px 18px 12px;box-shadow:4px 4px 0 var(--ink);padding:8px 14px 6px;transform:rotate(-1deg)}
.pair{flex-wrap:wrap;max-width:520px}
.pair b{font-family:var(--toon);font-weight:400;font-size:20px;color:var(--blue);white-space:nowrap}
.art{position:relative;justify-self:center;width:min(540px,100%);aspect-ratio:1;border:var(--line);border-radius:30px 20px 34px 18px/22px 32px 20px 30px;box-shadow:12px 12px 0 var(--ink);overflow:hidden;background:#fff;transform:rotate(1.5deg)}
.art img{position:absolute;inset:0;width:100%;height:100%}
.art .nemo{inset:auto;left:50.8%;top:56%;width:46.2%;height:auto;transform-origin:30% 100%;cursor:pointer;animation:bob 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:rotate(0)}50%{transform:rotate(-2.2deg) translateY(-1.5%)}}
.art .nemo.boing{animation:boing .5s cubic-bezier(.34,1.6,.64,1)}
@keyframes boing{30%{transform:translateY(-9%) rotate(-5deg) scale(1.03,.97)}60%{transform:translateY(1%) scale(.98,1.03)}}
.bubble{position:absolute;z-index:3;background:#fff;border:4px solid var(--ink);border-radius:26px 22px 28px 20px;padding:8px 18px 4px;font-family:var(--toon);font-size:26px;box-shadow:4px 4px 0 var(--ink);right:5%;top:40%;transition:transform .25s cubic-bezier(.34,1.6,.64,1),opacity .2s}
.bubble::after{content:"";position:absolute;left:24px;bottom:-22px;border:12px solid transparent;border-top:16px solid var(--ink)}
.bubble.off{transform:scale(.3) rotate(-10deg);opacity:0}

/* spot the difference: Nemo lies exactly on Mucron, a handle reveals him */
.diff{position:relative;width:min(640px,100%);aspect-ratio:1;margin:0 auto;border:var(--line);border-radius:28px 18px 32px 20px/20px 30px 18px 28px;box-shadow:12px 12px 0 var(--ink);overflow:hidden;touch-action:none;user-select:none;cursor:ew-resize;background:#fff}
.diff img{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.diff .top{clip-path:inset(0 0 0 var(--x,50%))}
.diff .handle{position:absolute;top:0;bottom:0;left:var(--x,50%);width:6px;margin-left:-3px;background:var(--ink)}
.diff .knob{position:absolute;top:50%;left:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:#fff;border:5px solid var(--ink);box-shadow:4px 4px 0 var(--ink);display:grid;place-items:center;font-family:var(--toon);font-size:26px}
.diff .tag{position:absolute;top:16px;font-family:var(--toon);font-size:22px;color:#fff;border:4px solid var(--ink);border-radius:12px;padding:6px 12px 2px;box-shadow:3px 3px 0 var(--ink)}
.diff .tag.l{left:16px;background:var(--skin);color:var(--ink)} .diff .tag.r{right:16px;background:var(--fur)}
.diff-note{text-align:center;font-size:22px;margin-top:22px}

/* le décret */
.decree-wrap{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center}
@media (max-width:900px){.decree-wrap{grid-template-columns:1fr}}
.decree{position:relative;background:#fff;border:var(--line);border-radius:12px 16px 10px 18px;box-shadow:var(--shadow);padding:34px 34px 30px;transform:rotate(-1deg);min-height:470px}
.decree::before{content:"";position:absolute;inset:10px;border:3px dashed var(--blue);border-radius:8px;pointer-events:none}
.decree h3{font-family:var(--toon);font-weight:400;font-size:38px;color:var(--blue);line-height:1;margin-bottom:4px}
.decree .sub{font-size:19px;color:#4b5862;margin-bottom:18px}
.decree ol{list-style:none;display:grid;gap:12px;font-size:23px;max-width:34ch}
.decree ol b{color:var(--red);font-family:var(--toon);font-weight:400;font-size:20px;margin-right:6px}
.decree .sig{margin-top:22px;font-size:22px;padding-right:150px}
.decree .sig img{display:inline-block;width:64px;vertical-align:middle;margin-right:8px}
.decree .stamp{position:absolute;right:22px;bottom:28px;font-family:var(--toon);font-size:26px;color:var(--red);border:6px solid var(--red);border-radius:14px;padding:8px 14px 2px;transform:rotate(-14deg);background:rgba(255,255,255,.85);line-height:1.05;text-align:center}
.decree .stamp.slam{animation:slam .45s cubic-bezier(.34,1.5,.64,1)}
@keyframes slam{0%{transform:rotate(-24deg) scale(2.3);opacity:0}60%{opacity:1}100%{transform:rotate(-14deg) scale(1)}}
.decree-side p{font-size:25px;margin-bottom:24px}

/* l'agenda du chien */
.agenda{position:relative;max-width:820px;margin-left:clamp(0px,6vw,80px)}
.agenda::before{content:"";position:absolute;left:111px;top:10px;bottom:10px;border-left:5px dotted var(--ink)}
.agenda li{list-style:none;display:grid;grid-template-columns:82px 32px 1fr;gap:14px;align-items:start;margin-bottom:22px}
.agenda time{font-family:var(--toon);font-size:24px;color:var(--blue);padding-top:6px;text-align:right}
.agenda .dot{width:30px;height:30px;border-radius:50%;border:5px solid var(--ink);background:var(--red);margin-top:4px;position:relative;z-index:1}
.agenda li:nth-child(3n+2) .dot{background:#fff} .agenda li:nth-child(3n) .dot{background:var(--blue)}
.agenda .what{font-size:24px;background:#fff;border:4px solid var(--ink);border-radius:18px 12px 20px 10px;box-shadow:4px 4px 0 var(--ink);padding:10px 16px 8px}
.agenda li.big .what{background:var(--skin);font-size:26px}
@media (max-width:560px){.agenda::before{left:87px}.agenda li{grid-template-columns:64px 30px 1fr;gap:10px}.agenda time{font-size:20px}}

/* tickets */
.tickets{display:grid;grid-template-columns:repeat(3,1fr);gap:26px}
@media (max-width:900px){.tickets{grid-template-columns:1fr}}
.ticket{position:relative;background:#fff;border:var(--line);border-radius:18px;box-shadow:var(--shadow);padding:22px 24px 22px 54px}
.ticket::before{content:"";position:absolute;left:30px;top:14px;bottom:14px;border-left:4px dashed var(--ink)}
.ticket::after{content:"";position:absolute;left:-14px;top:50%;width:22px;height:22px;margin-top:-11px;border-radius:50%;background:var(--paper);border:5px solid var(--ink);clip-path:inset(0 0 0 50%)}
.ticket:nth-child(1){transform:rotate(-1.5deg)} .ticket:nth-child(2){transform:rotate(1deg)} .ticket:nth-child(3){transform:rotate(-.6deg)}
.ticket h3{font-family:var(--toon);font-weight:400;font-size:30px;line-height:1;margin-bottom:8px}
.ticket:nth-child(1) h3{color:var(--blue)} .ticket:nth-child(2) h3{color:var(--ink)} .ticket:nth-child(3) h3{color:var(--red)}
.ticket p{font-size:22px}
.ticket .no{position:absolute;right:16px;top:12px;font-family:var(--toon);font-size:15px;color:#4b5862}

footer{border-top:var(--line);padding:56px 0 100px;position:relative;overflow:hidden}
footer .big{font-size:clamp(70px,13vw,170px);color:var(--blue);margin-bottom:24px}
footer p{max-width:64ch;font-size:18px;margin-bottom:10px;color:#3b4852}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) rotate(-2deg);z-index:40;font-family:var(--toon);font-size:21px;background:#fff;border:4px solid var(--ink);border-radius:16px;box-shadow:5px 5px 0 var(--ink);padding:10px 18px 4px}
@media (prefers-reduced-motion:reduce){.art .nemo{animation:none}.btn{transition:none}.decree .stamp.slam{animation:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="rough" x="-10%" y="-20%" width="120%" height="140%"><feTurbulence type="fractalNoise" baseFrequency="0.03 0.11" numOctaves="3" seed="5" /><feDisplacementMap in="SourceGraphic" scale="30" /></filter>
    <g id="stroke"><path d="M10 40 Q 150 10 300 30 T 590 30 L 590 110 Q 450 130 300 115 T 10 120 Z" filter="url(#rough)" /></g>
  </defs>
</svg>

<nav><div class="wrap">
  <a class="logo" href="#top"><img src="img/nemo-sticker.png" alt="" width="44" height="39"><span><b>NEMO</b> <i>MUCRON</i></span></a>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="en" aria-pressed="false">EN</button>
    <button type="button" data-lang="fr" aria-pressed="false">FR</button>
    <button type="button" data-lang="mix" class="mix" aria-pressed="true">EN MÊME TEMPS</button>
  </div>
  <a class="btn red small" id="buyNav" href="https://pump.fun" target="_blank" rel="noopener" data-t="buy"></a>
</div></nav>

<header id="top">
  <svg class="brush" viewBox="0 0 600 140" style="left:-4%;top:40px;width:46%;height:200px;fill:var(--red);transform:rotate(-8deg)"><use href="#stroke" /></svg>
  <svg class="brush" viewBox="0 0 600 140" style="right:-6%;top:120px;width:60%;height:300px;fill:var(--blue);transform:rotate(-24deg)"><use href="#stroke" /></svg>
  <div class="wrap hero">
    <div>
      <h1 class="toon" aria-label="Nemo Mucron"><span class="n">NEMO</span><span class="m">MUCRON</span></h1>
      <p class="say" data-t="tagline" data-html></p>
      <div class="cta">
        <a class="btn blue" id="buyBtn" href="https://pump.fun" target="_blank" rel="noopener" data-t="buyNemo"></a>
        <a class="btn red" href="#decret" data-t="toDecree"></a>
      </div>
      <div class="ca"><span>CA:</span> <code id="ca" data-t="caSoon"></code> <button class="btn small" id="copyCa" type="button" data-t="copy"></button></div>
      <div class="pair" id="pair"><b>$NEMO × $MUCRON</b><span data-t="paired"></span></div>
    </div>
    <div class="art" id="art">
      <img src="img/mucron-1000.png" alt="Mucron, the cartoon president, with his dog Nemo sitting next to him" width="1000" height="1000">
      <img class="nemo" id="nemo" src="img/nemo-pose.png" alt="" width="1005" height="975">
      <div class="bubble off" id="wouf">wouf.</div>
    </div>
  </div>
</header>

<section id="difference">
  <svg class="brush" viewBox="0 0 600 140" style="right:-10%;top:30px;width:50%;height:180px;fill:var(--skin);transform:rotate(6deg)"><use href="#stroke" /></svg>
  <div class="wrap">
    <h2 class="toon" style="color:var(--blue)" data-t="diffTitle"></h2>
    <p class="kicker" data-t="diffKicker"></p>
    <div class="diff" id="diff" role="slider" aria-label="Mucron or Nemo" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" tabindex="0">
      <img src="img/mucron-1000.png" alt="Mucron" width="1000" height="1000">
      <img class="top" src="img/nemo-full-1000.png" alt="Nemo in exactly the same pose" width="1000" height="1000">
      <div class="handle"><div class="knob">⇆</div></div>
      <span class="tag l">MUCRON</span><span class="tag r">NEMO</span>
    </div>
    <p class="diff-note" data-t="diffNote"></p>
  </div>
</section>

<section id="decret">
  <svg class="brush" viewBox="0 0 600 140" style="left:-8%;top:70px;width:46%;height:190px;fill:var(--blue);opacity:.14;transform:rotate(-4deg)"><use href="#stroke" /></svg>
  <div class="wrap">
    <h2 class="toon" style="color:var(--red)" data-t="decTitle"></h2>
    <div class="decree-wrap">
      <article class="decree" id="decree" aria-live="polite">
        <h3 id="dTitle"></h3>
        <div class="sub" id="dSub"></div>
        <ol id="dArticles"></ol>
        <div class="sig"><img src="img/nemo-sticker.png" alt="" width="64" height="56"><span id="dSig"></span></div>
        <div class="stamp" id="dStamp">APPROUVÉ<br>· WOUF ·</div>
      </article>
      <div class="decree-side">
        <p data-t="decKicker"></p>
        <div class="cta">
          <button class="btn blue" id="newDecree" type="button" data-t="decNew"></button>
          <button class="btn" id="saveDecree" type="button" data-t="decSave"></button>
        </div>
      </div>
    </div>
  </div>
</section>

<section id="agenda">
  <div class="wrap">
    <h2 class="toon" style="color:var(--blue)" data-t="agTitle"></h2>
    <p class="kicker" data-t="agKicker"></p>
    <ol class="agenda" id="agendaList"></ol>
  </div>
</section>

<section id="buy">
  <svg class="brush" viewBox="0 0 600 140" style="right:-6%;top:40px;width:48%;height:190px;fill:var(--red);opacity:.9;transform:rotate(-10deg)"><use href="#stroke" /></svg>
  <div class="wrap">
    <h2 class="toon" style="color:var(--red)" data-t="buyTitle"></h2>
    <div class="tickets" id="tickets"></div>
    <div class="cta" style="margin-top:38px">
      <a class="btn blue" id="buyBtn2" href="https://pump.fun" target="_blank" rel="noopener" data-t="buyPump"></a>
      <a class="btn" id="dexBtn" href="https://dexscreener.com/solana" target="_blank" rel="noopener" data-t="chart"></a>
      <a class="btn red" id="xBtn" href="https://x.com" target="_blank" rel="noopener" data-t="follow"></a>
    </div>
  </div>
</section>

<footer><div class="wrap">
  <div class="big toon">wouf.</div>
  <p data-t="legal1"></p>
  <p data-t="legal2"></p>
</div></footer>
<div class="toast" id="toast" hidden></div>

<script>
const $ = (s) => document.querySelector(s), $$ = (s) => [...document.querySelectorAll(s)];
const N = window.NEMO, reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- words: English, French, and "en même temps" (both at once) ---------- */
const T = {
  buy: { en: "buy", fr: "acheter", mix: "acheter" },
  buyNemo: { en: "buy $NEMO", fr: "acheter $NEMO", mix: "acheter $NEMO" },
  toDecree: { en: "read his decree", fr: "lire son décret", mix: "le décret, please" },
  tagline: { en: "the first dog of France. same face as his human. <u>at the same time</u>, a coin.",
    fr: "le premier chien de France. la même tête que son humain. <u>en même temps</u>, un coin.",
    mix: "le premier chien de France. same face as his human. <u>en même temps</u>, a coin." },
  caSoon: { en: "soon. nemo is still sniffing the carpet.", fr: "bientôt. nemo renifle encore le tapis.", mix: "bientôt. nemo is still sniffing le tapis." },
  copy: { en: "copy", fr: "copier", mix: "copier" },
  copied: { en: "copied. good boy.", fr: "copié. bon chien.", mix: "copié. good boy." },
  noCa: { en: "no CA yet. patience.", fr: "pas encore de CA. patience.", mix: "pas encore de CA. patience, mon ami." },
  paired: { en: "paired: every $NEMO buy also buys $MUCRON.", fr: "en paire : chaque achat de $NEMO achète aussi du $MUCRON.", mix: "en paire: every $NEMO buy achète aussi du $MUCRON." },
  diffTitle: { en: "spot the difference", fr: "trouvez la différence", mix: "trouvez la différence" },
  diffKicker: { en: "same neck. same face. same look. drag the handle.", fr: "même cou. même tête. même regard. tirez la poignée.", mix: "même cou. same face. même regard. drag the handle." },
  diffNote: { en: "one of them is the president. one of them is a very good boy. at the same time…", fr: "l'un est président. l'autre est un très bon chien. en même temps…", mix: "l'un est président. one is a very good boy. en même temps…" },
  decTitle: { en: "nemo's decree", fr: "le décret de nemo", mix: "le décret de nemo" },
  decKicker: { en: "every day the first dog signs a new decree. press the button, get yours, post it.", fr: "chaque jour le premier chien signe un nouveau décret. appuie, prends le tien, poste-le.", mix: "chaque jour le premier chien signs a new decree. press the button, poste-le." },
  decNew: { en: "new decree", fr: "nouveau décret", mix: "nouveau décret" },
  decSave: { en: "save as image", fr: "télécharger", mix: "télécharger" },
  agTitle: { en: "the dog's agenda", fr: "l'agenda du chien", mix: "l'agenda du chien" },
  agKicker: { en: "a very busy day at the palace.", fr: "une journée très chargée au palais.", mix: "une journée très chargée at the palace." },
  buyTitle: { en: "how to get $NEMO", fr: "comment avoir $NEMO", mix: "comment avoir $NEMO" },
  buyPump: { en: "buy on pump.fun", fr: "acheter sur pump.fun", mix: "acheter on pump.fun" },
  chart: { en: "chart", fr: "graphique", mix: "le chart" },
  follow: { en: "follow on X", fr: "suivre sur X", mix: "suivre on X" },
  legal1: { en: "$NEMO is a meme coin with no intrinsic value and no expectation of profit. For entertainment only. Never buy more than you can lose.",
    fr: "$NEMO est un meme coin sans valeur intrinsèque et sans promesse de profit. Pour le divertissement. N'achète jamais plus que ce que tu peux perdre.",
    mix: "$NEMO is a meme coin with no intrinsic value and no expectation of profit. Pour le divertissement. Never buy more than you can lose." },
  legal2: { en: "Parody. Not affiliated with, endorsed by or connected to Emmanuel Macron, the Élysée or the French Republic. Mucron art from the Mucron community; Nemo drawn in the same style.",
    fr: "Parodie. Aucun lien avec Emmanuel Macron, l'Élysée ou la République française. Dessin de Mucron par la communauté Mucron ; Nemo dessiné dans le même style.",
    mix: "Parodie. Not affiliated with Emmanuel Macron, l'Élysée or the French Republic. Mucron art from the Mucron community; Nemo dessiné dans le même style." },
};
const AGENDA = [
  ["08:00", "breakfast. one croissant. maybe two.", "petit-déjeuner. un croissant. peut-être deux."],
  ["09:30", "inspect the red carpet. sniff everything.", "inspection du tapis rouge. tout renifler."],
  ["11:00", "council of ministers. sit under the table.", "conseil des ministres. sous la table."],
  ["11:42", "the fireplace incident. historic.", "l'incident de la cheminée. historique.", true],
  ["14:00", "state nap. do not disturb.", "sieste d'État. ne pas déranger."],
  ["17:00", "copy the boss's face. same neck. same look.", "copier la tête du patron. même cou. même regard."],
  ["20:00", "at the same time: nothing.", "en même temps : rien."],
];
const TICKETS = [
  ["WALLET", "get Phantom and add some SOL.", "installe Phantom et ajoute des SOL."],
  ["PUMP.FUN", "paste the CA from the top. check it twice.", "colle le CA du haut. vérifie deux fois."],
  ["$NEMO", "swap. it buys $MUCRON on the way. only what you can lose.", "échange. ça achète du $MUCRON au passage. seulement ce que tu peux perdre."],
];
// the decree: each article in both languages; "en même temps" mixes them
const ARTICLES = [
  ["All croissants belong to Nemo. All of them.", "Tous les croissants appartiennent à Nemo. Tous."],
  ["Naps are now a national holiday.", "La sieste devient une fête nationale."],
  ["The red carpet is for sniffing.", "Le tapis rouge sert à renifler."],
  ["Every meeting ends when Nemo leaves the room.", "Chaque réunion se termine quand Nemo quitte la salle."],
  ["The garden pigeons are under surveillance.", "Les pigeons du jardin sont sous surveillance."],
  ["Belly rubs are a human right.", "Les gratouilles sont un droit de l'homme."],
  ["The fireplace remains a historic monument.", "La cheminée reste un monument historique."],
  ["Mucron must make the same face as Nemo. Not the other way round.", "Mucron doit faire la même tête que Nemo. Pas l'inverse."],
  ["Every Monday is a Sunday.", "Chaque lundi est un dimanche."],
  ["$NEMO is the official currency of the doghouse.", "$NEMO est la monnaie officielle de la niche."],
  ["Baths are cancelled until further notice.", "Les bains sont annulés jusqu'à nouvel ordre."],
  ["At the same time, nothing changes.", "En même temps, rien ne change."],
];
let lang = "mix";
try { lang = localStorage.getItem("nemo-lang") || "mix"; } catch {}
const pick = (en, fr, i = 0) => lang === "en" ? en : lang === "fr" ? fr : (i % 2 ? en : fr);
function render() {
  document.documentElement.lang = lang === "en" ? "en" : "fr";
  for (const b of $$(".lang button")) b.setAttribute("aria-pressed", b.dataset.lang === lang);
  for (const el of $$("[data-t]")) { if (el.id === "ca" && N.CA) continue; const t = T[el.dataset.t][lang]; el.hasAttribute("data-html") ? (el.innerHTML = t) : (el.textContent = t); }
  $("#agendaList").innerHTML = AGENDA.map(([t, en, fr, big], i) => `<li class="${big ? "big" : ""}"><time>${t}</time><span class="dot"></span><div class="what">${pick(en, fr, i)}</div></li>`).join("");
  $("#tickets").innerHTML = TICKETS.map(([h, en, fr], i) => `<div class="ticket"><span class="no">N° 00${i + 1}</span><h3>${h}</h3><p>${pick(en, fr, i + 1)}</p></div>`).join("");
  drawDecree(false);
}
for (const b of $$(".lang button")) b.onclick = () => { lang = b.dataset.lang; try { localStorage.setItem("nemo-lang", lang); } catch {} render(); };

/* ---------- config ---------- */
if (N.CA) {
  $("#ca").textContent = N.CA;
  for (const id of ["#buyBtn", "#buyBtn2", "#buyNav"]) $(id).href = "https://pump.fun/coin/" + N.CA;
  $("#dexBtn").href = "https://dexscreener.com/solana/" + N.CA;
}
if (N.X) $("#xBtn").href = "https://x.com/" + N.X;
if (N.PAIR_CA === null) $("#pair").hidden = true; // set PAIR_CA to null if $NEMO is not paired
function toast(t) { const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (el.hidden = true), 1800); }
$("#copyCa").onclick = async () => {
  if (!N.CA) return toast(T.noCa[lang]);
  try { await navigator.clipboard.writeText(N.CA); toast(T.copied[lang]); } catch { toast("copy failed / échec"); }
};

/* ---------- nemo in the hero: click him ---------- */
const nemo = $("#nemo"), wouf = $("#wouf"), woufs = ["wouf.", "en même temps.", "non.", "oui. non.", "c'est moi.", "vive le $NEMO."];
let wi = 0;
nemo.addEventListener("click", () => {
  nemo.classList.remove("boing"); void nemo.offsetWidth; nemo.classList.add("boing");
  wouf.textContent = woufs[wi++ % woufs.length]; wouf.classList.remove("off");
  clearTimeout(wouf.t); wouf.t = setTimeout(() => wouf.classList.add("off"), 1300);
});
nemo.addEventListener("animationend", () => nemo.classList.remove("boing"));

/* ---------- spot the difference ---------- */
const diff = $("#diff");
const setX = (p) => { p = Math.max(0, Math.min(100, p)); diff.style.setProperty("--x", p + "%"); diff.setAttribute("aria-valuenow", Math.round(p)); };
let dragging = false;
const fromEvent = (e) => { const r = diff.getBoundingClientRect(); setX(((e.clientX - r.left) / r.width) * 100); };
diff.addEventListener("pointerdown", (e) => { dragging = true; diff.setPointerCapture(e.pointerId); fromEvent(e); stopTease(); });
diff.addEventListener("pointermove", (e) => dragging && fromEvent(e));
diff.addEventListener("pointerup", () => (dragging = false));
diff.addEventListener("keydown", (e) => { const v = +diff.getAttribute("aria-valuenow"); if (e.key === "ArrowLeft") setX(v - 5); if (e.key === "ArrowRight") setX(v + 5); stopTease(); });
// one sweep of the handle when it scrolls into view, so people see that it moves
let tease = 0, teased = false;
function stopTease() { cancelAnimationFrame(tease); teased = true; }
new IntersectionObserver(([en]) => {
  if (!en.isIntersecting || teased || reduce) return; teased = true; const t0 = performance.now();
  (function step(t) { const k = Math.min(1, (t - t0) / 1800); setX(50 + Math.sin(k * Math.PI * 2) * 32 * (1 - k)); if (k < 1) tease = requestAnimationFrame(step); })(t0);
}, { threshold: 0.6 }).observe(diff);

/* ---------- le décret ---------- */
let decree = null;
function newDecree() { decree = { no: 100 + Math.floor(Math.random() * 900), arts: [...ARTICLES.keys()].sort(() => Math.random() - 0.5).slice(0, 3) }; }
function decreeText() {
  return {
    title: lang === "en" ? `DECREE No. ${decree.no}` : `DÉCRET N° ${decree.no}`,
    sub: lang === "en" ? "from the desk of the first dog of France" : lang === "fr" ? "du bureau du premier chien de France" : "du bureau du first dog of France",
    arts: decree.arts.map((a, i) => ({ n: `Article ${i + 1}.`, t: pick(ARTICLES[a][0], ARTICLES[a][1], i) })),
    sig: lang === "en" ? "Nemo, First Dog of France" : lang === "fr" ? "Nemo, Premier Chien de France" : "Nemo, Premier Chien · first dog",
  };
}
function drawDecree(slam) {
  if (!decree) newDecree();
  const d = decreeText();
  $("#dTitle").textContent = d.title; $("#dSub").textContent = d.sub; $("#dSig").textContent = "— " + d.sig;
  $("#dArticles").innerHTML = d.arts.map((a) => `<li><b>${a.n}</b>${a.t}</li>`).join("");
  const st = $("#dStamp"); if (slam) { st.classList.remove("slam"); void st.offsetWidth; st.classList.add("slam"); }
}
$("#newDecree").onclick = () => { newDecree(); drawDecree(true); };

// save the decree as a picture to post, drawn on a canvas in the same cartoon style
const sticker = new Image(); sticker.src = "img/nemo-sticker.png";
function wrap(ctx, text, x, y, maxW, lh) {
  let line = "", yy = y;
  for (const w of text.split(" ")) { const t = line ? line + " " + w : w; if (ctx.measureText(t).width > maxW && line) { ctx.fillText(line, x, yy); line = w; yy += lh; } else line = t; }
  ctx.fillText(line, x, yy); return yy + lh;
}
$("#saveDecree").onclick = async () => {
  await document.fonts.ready;
  const W = 1080, H = 1350, c = document.createElement("canvas"); c.width = W; c.height = H; const x = c.getContext("2d"), d = decreeText();
  x.fillStyle = "#fff"; x.fillRect(0, 0, W, H);
  x.save(); x.translate(860, 110); x.rotate(-0.4); x.fillStyle = "#173286"; x.fillRect(-260, -60, 620, 120); x.restore();
  x.save(); x.translate(120, 1240); x.rotate(-0.15); x.fillStyle = "#e7171e"; x.fillRect(-200, -50, 520, 100); x.restore();
  x.save(); x.translate(W / 2, H / 2); x.rotate(-0.012);
  x.fillStyle = "#0e1f29"; x.fillRect(-426, -546, 880, 1120);
  x.fillStyle = "#fff"; x.fillRect(-440, -560, 880, 1120); x.lineWidth = 8; x.strokeStyle = "#0e1f29"; x.strokeRect(-440, -560, 880, 1120);
  x.setLineDash([14, 10]); x.lineWidth = 4; x.strokeStyle = "#173286"; x.strokeRect(-420, -540, 840, 1080); x.setLineDash([]);
  x.fillStyle = "#173286"; x.font = "64px 'Luckiest Guy'"; x.fillText(d.title, -380, -440);
  x.fillStyle = "#4b5862"; x.font = "32px 'Patrick Hand'"; x.fillText(d.sub, -380, -390);
  let y = -300;
  for (const a of d.arts) { x.fillStyle = "#e7171e"; x.font = "34px 'Luckiest Guy'"; x.fillText(a.n, -380, y); x.fillStyle = "#0e1f29"; x.font = "40px 'Patrick Hand'"; y = wrap(x, a.t, -380, y + 50, 760, 48) + 26; }
  if (sticker.complete) x.drawImage(sticker, -390, 300, 150, 132);
  x.fillStyle = "#0e1f29"; x.font = "38px 'Patrick Hand'"; x.fillText("— " + d.sig, -220, 360);
  x.save(); x.translate(250, 505); x.rotate(-0.25); x.strokeStyle = "#e7171e"; x.lineWidth = 10; x.strokeRect(-150, -62, 300, 124);
  x.fillStyle = "#e7171e"; x.font = "46px 'Luckiest Guy'"; x.textAlign = "center"; x.fillText("APPROUVÉ", 0, -6); x.fillText("· WOUF ·", 0, 44); x.restore();
  x.restore();
  x.fillStyle = "#0e1f29"; x.font = "34px 'Luckiest Guy'"; x.textAlign = "center"; x.fillText("$NEMO · NEMO MUCRON", W / 2, H - 40);
  c.toBlob((b) => { const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = `nemo-decret-${decree.no}.png`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }, "image/png");
};

render();
</script>
