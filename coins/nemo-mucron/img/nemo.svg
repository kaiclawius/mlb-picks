<svg xmlns="http://www.w3.org/2000/svg" viewBox="540 400 470 640" width="940" height="1280">
  <!-- Nemo alone, transparent, in the Mucron style (outline #0e1f29) -->
  <g stroke="#0e1f29" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
<!-- ===== NEMO ===== -->
    <!-- body, sitting -->
    <path d="M 610 1020 Q 600 880 660 790 Q 720 720 840 720 Q 950 730 980 830 Q 1000 920 990 1020 Z" fill="#1d1d21" />
    <!-- front legs -->
    <path d="M 690 1020 Q 690 930 710 870 L 770 872 Q 760 940 765 1020 Z" fill="#17171a" stroke-width="6" />
    <path d="M 800 1020 Q 802 940 812 880 L 870 884 Q 862 950 866 1020 Z" fill="#17171a" stroke-width="6" />
    <!-- head: the long face, leaning toward Mucron -->
    <path d="M 930 720 Q 965 640 950 570 Q 935 470 860 440 Q 790 415 720 450 Q 670 480 650 540 Q 600 580 575 615 Q 555 650 580 670 Q 620 690 680 690 Q 720 712 790 732 Q 870 750 930 720 Z" fill="#1d1d21" />
    <!-- fur shine -->
    <path d="M 760 462 Q 820 448 870 470" fill="none" stroke="#45454e" stroke-width="7" />
    <path d="M 640 590 Q 660 572 690 566" fill="none" stroke="#45454e" stroke-width="6" />
    <path d="M 690 800 Q 720 770 760 760" fill="none" stroke="#3a3a42" stroke-width="7" />
    <path d="M 940 760 Q 990 860 985 1000" fill="none" stroke="#4a4a54" stroke-width="6" />
    <path d="M 735 452 Q 800 425 875 448" fill="none" stroke="#55555f" stroke-width="5" />
    <!-- floppy ear -->
    <path d="M 880 455 Q 945 450 965 520 Q 985 610 950 660 Q 925 640 915 600 Q 900 540 880 500 Z" fill="#101012" />
    <!-- nose -->
    <ellipse cx="585" cy="628" rx="30" ry="24" fill="#050506" />
    <ellipse cx="575" cy="618" rx="9" ry="6" fill="#6b6b74" stroke="none" />
    <!-- mouth: flat, unimpressed -->
    <path d="M 600 668 Q 650 678 700 668" fill="none" stroke="#000" stroke-width="5" />
    <!-- eyes: same side-eye, irises pushed toward Mucron, heavy black lids -->
    <ellipse cx="712" cy="540" rx="34" ry="24" fill="#ffffff" />
    <circle cx="694" cy="545" r="13" fill="#a8692a" stroke-width="4" />
    <circle cx="691" cy="545" r="6" fill="#0e1f29" stroke="none" />
    <path d="M 678 527 Q 712 518 746 530 L 746 520 Q 712 506 678 518 Z" fill="#1d1d21" />
    <path d="M 678 530 Q 712 520 746 532" fill="none" stroke-width="6" />
    <ellipse cx="808" cy="530" rx="38" ry="27" fill="#ffffff" />
    <circle cx="788" cy="536" r="15" fill="#a8692a" stroke-width="4" />
    <circle cx="784" cy="536" r="7" fill="#0e1f29" stroke="none" />
    <path d="M 770 515 Q 808 504 846 518 L 846 506 Q 808 490 770 504 Z" fill="#1d1d21" />
    <path d="M 770 518 Q 808 506 846 520" fill="none" stroke-width="6" />
    <!-- red collar with a tag -->
    <path d="M 700 702 Q 800 740 925 718 L 932 750 Q 800 776 694 734 Z" fill="#e7171e" />
    <circle cx="790" cy="770" r="16" fill="#e8c35a" stroke-width="4" />
    <circle cx="790" cy="770" r="5" fill="#b08a2a" stroke="none" />
    </g>
</svg>