<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="robots" content="noindex">

<style>
:root{--tile:#E8EEF0;--grid:rgba(13,34,48,.07);--ink:#0D2230;--signal:#F2C200;--soft:#3F5663}
*{box-sizing:border-box}
body{margin:0;width:1200px;height:630px;background:var(--tile);color:var(--ink);font-family:"Atkinson Hyperlegible Next",sans-serif;overflow:hidden;
 background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:56px 56px;position:relative}
.brand{position:absolute;left:72px;top:56px;display:flex;align-items:center;gap:14px;font:800 44px/1 "Barlow Condensed";text-transform:uppercase;letter-spacing:.02em}
.meta{position:absolute;right:72px;top:68px;font:500 20px "IBM Plex Mono";letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}

.hl{background:linear-gradient(transparent 62%,var(--signal) 62%,var(--signal) 92%,transparent 92%);padding-inline:8px;margin-inline:-8px}
.sub{position:absolute;left:72px;bottom:56px;font:500 26px "IBM Plex Mono";letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
